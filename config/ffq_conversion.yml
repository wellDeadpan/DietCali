# FFQ frequency -> servings/day conversion
# Source: Harvard FFQ Grid2022 frequency factors (ffwgt0-ffwgt9).
# `value` = response code as it appears in the FFQ data;
# `ffwgt` = the corresponding Grid2022 factor index (value - 1).
freq_conversion:
  - value: 1
    ffwgt: 0
    label: "Never (default for no answer)"
    coefficient: 0
  - value: 2
    ffwgt: 1
    label: "1-3/mo"
    coefficient: 0.08
  - value: 3
    ffwgt: 2
    label: "1/wk"
    coefficient: 0.14
  - value: 4
    ffwgt: 3
    label: "2-4/wk"
    coefficient: 0.43
  - value: 5
    ffwgt: 4
    label: "5-6/wk"
    coefficient: 0.8
  - value: 6
    ffwgt: 5
    label: "1/day"
    coefficient: 1
  - value: 7
    ffwgt: 6
    label: "2-3/day"
    coefficient: 2.5
  - value: 8
    ffwgt: 7
    label: "4-5/day"
    coefficient: 4.5
  - value: 9
    ffwgt: 8
    label: "6/day"
    coefficient: 6
  - value: 10
    ffwgt: 9
    label: "Passthru"
    # Grid2022 factor is 0; set to NA until we confirm how pass-through
    # responses should be handled (TODO: revisit)
    coefficient: .
