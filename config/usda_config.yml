# API key is NOT stored here. Set it in the environment variable named below,
# e.g. add a line `FDC_API_KEY=your_key` to ~/.Renviron and restart R.
api_key_env: "FDC_API_KEY"
base_url: "https://api.nal.usda.gov/fdc"
version: "v1"
endpoints:
  search: "foods/search"
  food: "food"
  foods: "foods"
default_dataTypes: ["Foundation", "SR Legacy", "Branded", "Survey (FNDDS)", "Experimental "]
default_pageSize: 50
default_numberOfResultsPerPage: 50
